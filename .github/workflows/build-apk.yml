
name: Build Status Saver APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q StatusSaver_GitHub_APK_Builder.zip -d source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/StatusSaver/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }""",
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p source/StatusSaver assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusSaver-debug-apk
          path: source/StatusSaver/app/build/outputs/apk/debug/app-debug.apk
